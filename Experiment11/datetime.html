<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Date</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#1E3C72,#2A5298);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:white;
    padding:35px;
    text-align:center;
    border-radius:15px;
    box-shadow:0px 8px 20px rgba(0,0,0,0.3);
}

h1{
    color:#003366;
    margin-bottom:15px;
}

h3{
    color:#666;
    margin-bottom:25px;
}

#date{
    font-size:28px;
    color:#0066cc;
    font-weight:bold;
    background:#f4f7fc;
    padding:15px;
    border-radius:8px;
    border:2px solid #0066cc;
}

.footer{
    margin-top:25px;
    color:#555;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

    <h1>📅 Today's Date</h1>

    <h3>JavaScript Date Demonstration</h3>

    <div id="date"></div>

    <div class="footer">
        Government Polytechnic Mumbai<br>
        First Year Computer Engineering
    </div>

</div>

<script>

    var today = new Date();

    document.getElementById("date").innerHTML =
        today.toDateString();

</script>

</body>
</html>
