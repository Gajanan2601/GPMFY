<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>  Student Feedback Form</title>
</head>

<body>

<div class="container">

    <h1>Government Polytechnic Mumbai</h1>
    <h3>Department of Computer Engineering</h3>
    <h5>Student Feedback Form (First Year)</h5>
    <hr>

    <form>

        <table>

            <tr>
                <td><b>Student Name</b></td>
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>

            <tr>
                <td><b>Roll Number</b></td>
                <td><input type="text" placeholder="Enter Roll No."></td>
            </tr>

            <tr>
                <td><b>Email</b></td>
                <td><input type="email" placeholder="Enter Email"></td>
            </tr>

            <tr>
                <td><b>Division</b></td>
                <td>
                    <select>
                        <option>Select Division</option>
                        <option>A</option>
                        <option>B</option>
                        <option>C</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><b>Semester</b></td>
                <td>
                    <select>
                        <option>Select Semester</option>
                        <option>Semester I</option>
                        <option>Semester II</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><b>Gender</b></td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                    <input type="radio" name="gender"> Other
                </td>
            </tr>

            <tr>
                <td><b>Subject</b></td>
                <td>
                    <select>
                        <option>Select Subject</option>
                        <option>Mathematics</option>
                        <option>Physics</option>
                        <option>C Programming</option>
                        <option>Engineering Graphics</option>
                        <option>Communication Skills</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><b>Rate the Teaching</b></td>
                <td>
                    <input type="radio" name="rate"> Excellent
                    <input type="radio" name="rate"> Good
                    <input type="radio" name="rate"> Average
                    <input type="radio" name="rate"> Poor
                </td>
            </tr>

            <!-- <tr>
                <td><b>Facilities Used</b></td>
                <td>
                    <input type="checkbox"> Computer Lab<br>
                    <input type="checkbox"> Library<br>
                    <input type="checkbox"> Wi-Fi<br>
                    <input type="checkbox"> Classroom
                </td>
            </tr> -->

            <tr>
                <td><b>Suggestions</b></td>
                <td>
                    <textarea rows="5" placeholder="Write your feedback here..."></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" class="btn">
                    <input type="submit" value="Submit Feedback">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

</div>

</body>
</html>
